# Publica el sitio en GitHub Pages cada vez que se sube algo a main
# (o a mano desde la pestaña Actions > "Publicar en GitHub Pages" > Run workflow).
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Sin dominio propio el sitio vive en una subcarpeta con el nombre del repositorio.
      # Al conectar teloarmo.cl: SITIO: https://teloarmo.cl y BASE: /
      SITIO: https://teloarmo.github.io
      BASE: /teloarmo
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
